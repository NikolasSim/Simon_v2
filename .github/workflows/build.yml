name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      - run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          tail -n 80 build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log